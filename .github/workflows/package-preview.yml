name: Package Windows Preview 5
on:
  push:
    branches: [windows-preview-5-package]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and attach Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/sdc-preview5/{base,asset}
          gh release download windows-preview-4 --pattern SDC-BULKVIDDL-Windows-x64.zip --dir /tmp/sdc-preview5/base
          python .github/package-preview.py
          gh release upload windows-preview-5 /tmp/sdc-preview5/asset/SDC-BULKVIDDL-Windows-x64.zip
